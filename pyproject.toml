[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "self-refining-codegen"
version = "0.1.0"
description = "Execution-feedback research pipeline for self-refining code generation"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "coverage==7.6.12",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
