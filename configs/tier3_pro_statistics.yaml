    second: codellama_he_bo5

  - key: codellama_he_adaptive_vs_fixed
    first: codellama_he_adaptive
    second: codellama_he_fixed

  - key: codellama_mbpp_adaptive_vs_bo5
    first: codellama_mbpp_adaptive
    second: codellama_mbpp_bo5

  - key: codellama_mbpp_adaptive_vs_fixed
