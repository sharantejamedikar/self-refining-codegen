analysis:
  seed: 42
  bootstrap_resamples: 10000
  confidence_level: 0.95
  significance_level: 0.05
  output_path: docs/validation/tier3_pro_statistics.json

runs:
  qwen_he_single:
    label: "Qwen HumanEval Pro single-pass"
    benchmark: "HumanEval Pro"
    run_dir: "experiments/results/20260813T183045.045329Z_cluster_qwen_hf_zero_shot_humaneval_pro_full"

  qwen_he_bo5:
    label: "Qwen HumanEval Pro best-of-5"
    benchmark: "HumanEval Pro"
    run_dir: "experiments/results/20260813T192056.676310Z_cluster_qwen_hf_best_of_5_humaneval_pro_full"

  qwen_he_adaptive:
    label: "Qwen HumanEval Pro adaptive refinement"
    benchmark: "HumanEval Pro"
    run_dir: "experiments/results/20260813T184952.779911Z_cluster_qwen_hf_hybrid_refinement_adaptive_humaneval_pro_full"

  qwen_he_fixed:
    label: "Qwen HumanEval Pro fixed-k ever-solved"
    benchmark: "HumanEval Pro"
    run_dir: "experiments/results/20260813T193614.306952Z_cluster_qwen_hf_hybrid_refinement_fixed_humaneval_pro_full"

  qwen_mbpp_single:
