    label: "CodeLlama HumanEval Pro fixed-k ever-solved"
    benchmark: "HumanEval Pro"
    run_dir: "experiments/results/20260814T042300.202631Z_cluster_codellama_13b_bnb_8bit_hybrid_refinement_fixed_humaneval_pro_full"

  codellama_mbpp_single:
    label: "CodeLlama MBPP Pro single-pass"
    benchmark: "MBPP Pro"
    run_dir: "experiments/results/20260814T085130.689741Z_cluster_codellama_13b_bnb_8bit_zero_shot_mbpp_pro_full"

