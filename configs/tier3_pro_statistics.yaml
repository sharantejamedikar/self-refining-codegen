comparisons:
  - key: qwen_he_adaptive_vs_bo5
    first: qwen_he_adaptive
    second: qwen_he_bo5

  - key: qwen_he_adaptive_vs_fixed
    first: qwen_he_adaptive
    second: qwen_he_fixed

  - key: qwen_mbpp_adaptive_vs_bo5
    first: qwen_mbpp_adaptive
    second: qwen_mbpp_bo5

  - key: qwen_mbpp_adaptive_vs_fixed
    first: qwen_mbpp_adaptive
    second: qwen_mbpp_fixed

  - key: codellama_he_adaptive_vs_bo5
