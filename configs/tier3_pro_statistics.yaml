  qwen_mbpp_fixed:
    label: "Qwen MBPP Pro fixed-k ever-solved"
    benchmark: "MBPP Pro"
    run_dir: "experiments/results/20260814T003756.562519Z_cluster_qwen_hf_hybrid_refinement_fixed_mbpp_pro_full"

  codellama_he_single:
