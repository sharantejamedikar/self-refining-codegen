comparisons:
  - key: humaneval_refined_vs_bo5
    first: humaneval_refined
    second: humaneval_bo5
  - key: mbpp_refined_vs_bo5
    first: mbpp_refined
    second: mbpp_bo5
  - key: humaneval_trace_vs_template
    first: humaneval_trace
    second: humaneval_template_m5
  - key: humaneval_hybrid_vs_template
    first: humaneval_hybrid
    second: humaneval_template_m5
  - key: mbpp_trace_vs_template
    first: mbpp_trace
    second: mbpp_template_m5
  - key: mbpp_hybrid_vs_template
    first: mbpp_hybrid
    second: mbpp_template_m5
