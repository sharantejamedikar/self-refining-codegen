analysis:
  seed: 42
  bootstrap_resamples: 10000
  confidence_level: 0.95
  significance_level: 0.05
  output_path: docs/validation/standard_benchmark_statistics.json

runs:
  qwen_he_bo5:
    label: "Qwen HumanEval best-of-5"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260808T210242.687568Z_cluster_qwen_hf_best_of_5_humaneval_full"

  qwen_he_adaptive:
    label: "Qwen HumanEval adaptive refinement"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260808T215208.948344Z_cluster_qwen_hf_hybrid_refinement_adaptive_humaneval_full"

  qwen_he_fixed:
    label: "Qwen HumanEval fixed-k ever-solved"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260808T220435.152210Z_cluster_qwen_hf_hybrid_refinement_fixed_humaneval_full"

  qwen_mbpp_bo5:
    label: "Qwen sanitised MBPP best-of-5"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260809T103719.229806Z_cluster_qwen_hf_best_of_5_mbpp_full"

  qwen_mbpp_adaptive:
    label: "Qwen sanitised MBPP adaptive refinement"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260809T155124.955006Z_cluster_qwen_hf_hybrid_refinement_adaptive_mbpp_full"

  qwen_mbpp_fixed:
    label: "Qwen sanitised MBPP fixed-k ever-solved"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260809T162731.848774Z_cluster_qwen_hf_hybrid_refinement_fixed_mbpp_full"

  codellama_he_bo5:
    label: "CodeLlama HumanEval best-of-5"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260810T121044.505386Z_cluster_codellama_13b_bnb_8bit_best_of_5_humaneval_full"

  codellama_he_adaptive:
    label: "CodeLlama HumanEval adaptive refinement"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260810T164232.226049Z_cluster_codellama_13b_bnb_8bit_hybrid_refinement_adaptive_humaneval_full"

  codellama_he_fixed:
    label: "CodeLlama HumanEval fixed-k ever-solved"
    benchmark: "HumanEval"
    run_dir: "experiments/results/20260810T220239.789427Z_cluster_codellama_13b_bnb_8bit_hybrid_refinement_fixed_humaneval_full"

  codellama_mbpp_bo5:
    label: "CodeLlama sanitised MBPP best-of-5"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260811T185140.732397Z_cluster_codellama_13b_bnb_8bit_best_of_5_mbpp_full"

  codellama_mbpp_adaptive:
    label: "CodeLlama sanitised MBPP adaptive refinement"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260812T222900Z_cluster_codellama_13b_bnb_8bit_hybrid_refinement_adaptive_mbpp_full"

  codellama_mbpp_fixed:
    label: "CodeLlama sanitised MBPP fixed-k ever-solved"
    benchmark: "sanitised MBPP"
    run_dir: "experiments/results/20260813T005000Z_cluster_codellama_13b_bnb_8bit_hybrid_refinement_fixed_mbpp_full"

comparisons:
  - key: qwen_he_adaptive_vs_bo5
    first: qwen_he_adaptive
    second: qwen_he_bo5

  - key: qwen_he_adaptive_vs_fixed
    first: qwen_he_adaptive
    second: qwen_he_fixed

  - key: qwen_mbpp_adaptive_vs_bo5
    first: qwen_mbpp_adaptive
    second: qwen_mbpp_bo5

  - key: qwen_mbpp_adaptive_vs_fixed
    first: qwen_mbpp_adaptive
    second: qwen_mbpp_fixed

  - key: codellama_he_adaptive_vs_bo5
    first: codellama_he_adaptive
    second: codellama_he_bo5

  - key: codellama_he_adaptive_vs_fixed
    first: codellama_he_adaptive
    second: codellama_he_fixed

  - key: codellama_mbpp_adaptive_vs_bo5
    first: codellama_mbpp_adaptive
    second: codellama_mbpp_bo5

  - key: codellama_mbpp_adaptive_vs_fixed
    first: codellama_mbpp_adaptive
    second: codellama_mbpp_fixed
